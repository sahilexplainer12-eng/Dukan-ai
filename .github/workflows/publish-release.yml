name: Publish Release Asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact and Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 46026874767 --repo sahilexplainer12-eng/Dukan-ai -n DukaanAI-Debug-APK --dir ./apk-dir
          ls -lh ./apk-dir
          gh release upload v1.4.0-whisper-base ./apk-dir/app-debug.apk --repo sahilexplainer12-eng/Dukan-ai --clobber
