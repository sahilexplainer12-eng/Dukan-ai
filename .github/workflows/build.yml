name: Build Dukaan AI APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Download Sherpa-ONNX Runtime and Multilingual Whisper Model
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/assets
          echo "Downloading Sherpa-ONNX runtime AAR..."
          curl -SL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar
          echo "Downloading official multilingual Whisper Tiny model (with Hindi support)..."
          curl -SL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-tiny.tar.bz2 | tar -xjf - -C app/src/main/assets/
          echo "Verifying downloaded files:"
          ls -lh app/libs/
          ls -lh app/src/main/assets/sherpa-onnx-whisper-tiny/

      - name: Run Tests and Build Debug APK with Gradle
        run: ./gradlew test assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          echo "Checking generated APK files:"
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DukaanAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
