name: Build Dukaan AI APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Download Sherpa-ONNX Runtime and Multilingual Whisper Model
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/assets/whisper-tiny
          echo "Downloading Sherpa-ONNX runtime AAR..."
          curl -SL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar
          echo "Downloading multilingual Whisper Tiny encoder (int8)..."
          curl -SL -o app/src/main/assets/whisper-tiny/tiny-encoder.int8.onnx https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main/tiny-encoder.int8.onnx
          echo "Downloading multilingual Whisper Tiny decoder (int8)..."
          curl -SL -o app/src/main/assets/whisper-tiny/tiny-decoder.int8.onnx https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main/tiny-decoder.int8.onnx
          echo "Downloading Whisper tokens..."
          curl -SL -o app/src/main/assets/whisper-tiny/tiny-tokens.txt https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main/tiny-tokens.txt
          echo "Verifying downloaded files:"
          ls -lh app/libs/
          ls -lh app/src/main/assets/whisper-tiny/

      - name: Run Tests and Build Debug APK with Gradle
        run: ./gradlew test assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          echo "Checking generated APK files:"
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DukaanAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
